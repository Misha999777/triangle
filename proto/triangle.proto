syntax = "proto3";

package triangle.v1;

message Parameters {
  optional float k1 = 1;
  optional float k2 = 2;
  optional float k3 = 3;
  optional float target_angle = 4;
}

enum CommandType {
  COMMAND_TYPE_UNSPECIFIED = 0;
  COMMAND_TYPE_SAVE_PARAMETERS = 1;
}

message Command {
  CommandType type = 1;
}

message TelemetrySample {
  uint32 sequence = 1;
  uint32 time_ms = 2;
  float angle = 3;
  float angular_velocity = 4;
  float wheel_velocity = 5;
  float torque = 6;
  float target_angle = 7;
  bool balancing = 8;
}

message TelemetryBatch {
  repeated TelemetrySample samples = 1;
}

enum Error {
  ERROR_NONE = 0;
  ERROR_INVALID_VALUE = 128;
  ERROR_BUSY = 129;
  ERROR_UNKNOWN_COMMAND = 130;
}
