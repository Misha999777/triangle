syntax = "proto3";

package triangle.v1;

message Parameters {
  optional float k1 = 1;
  optional float k2 = 2;
  optional float k3 = 3;
  optional float target_angle = 4;
}

enum CommandType {
  COMMAND_TYPE_UNSPECIFIED = 0;
  COMMAND_TYPE_SAVE_PARAMETERS = 1;
}

message Command {
  CommandType type = 1;
}

message TelemetryBatch {
  uint32 sequence = 1;
  uint32 time_ms = 2;
  repeated uint32 time_delta_ms = 3;
  repeated float angle = 4;
  repeated float angular_velocity = 5;
  repeated float wheel_velocity = 6;
  repeated float torque = 7;
  repeated float target_angle = 8;
  repeated bool balancing = 9;
}

enum Error {
  ERROR_NONE = 0;
  ERROR_INVALID_VALUE = 128;
  ERROR_BUSY = 129;
  ERROR_UNKNOWN_COMMAND = 130;
}
