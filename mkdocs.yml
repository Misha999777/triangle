site_name: Triangle
site_description: Self-balancing reaction wheel robot project powered by the Raspberry Pi Pico 2 W
site_author: Misha999777
repo_url: https://github.com/Misha999777/triangle

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Hardware:
    - Overview: hardware/index.md
    - Bill of Materials: hardware/bom.md
    - 3D Models: hardware/models.md
  - Software:
    - Architecture: software/architecture.md
    - Building & Flashing: software/building.md
  - Tuning: tuning.md
