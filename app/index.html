<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon.svg"/>
    <link rel="manifest" href="manifest.json">
    <title>Triangle Dashboard</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container pt-5" style="max-width: 500px;">
        <h2 class="text-center mb-4 fw-bold text-primary">Triangle Dashboard</h2>

        <div class="card shadow-sm mb-4 border-0">
            <div class="card-body">
                <h5 class="card-title text-secondary border-bottom pb-2 mb-3">Connection</h5>

                <div class="d-flex justify-content-between align-items-center">
                    <button id="connectBtn" class="btn btn-primary px-4 fw-semibold">Connect</button>
                    <span id="status" class="badge bg-secondary fs-6">Disconnected</span>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-4 border-0">
            <div class="card-body">
                <h5 class="card-title text-secondary border-bottom pb-2 mb-3">Telemetry</h5>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="fw-semibold text-muted">Target Angle:</span>
                    <span id="targetAngle" class="badge bg-info text-dark fs-6" style="min-width: 60px;">-</span>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                    <span class="fw-semibold text-muted">Current Angle:</span>
                    <span id="currentAngle" class="badge bg-info text-dark fs-6" style="min-width: 60px;">-</span>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0 mb-5">
            <div class="card-body">
                <h5 class="card-title text-secondary border-bottom pb-2 mb-3">Parameters</h5>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted mb-1">k1</label>
                    <div class="input-group">
                        <input id="k1" type="number" step="0.1" value="10.0" class="form-control" placeholder="10.0">
                        <button class="btn btn-primary updateBtn" data-index="1" data-input="k1">Update</button>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted mb-1">k2</label>
                    <div class="input-group">
                        <input id="k2" type="number" step="0.1" value="0.3" class="form-control" placeholder="0.3">
                        <button class="btn btn-primary updateBtn" data-index="2" data-input="k2">Update</button>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted mb-1">k3</label>
                    <div class="input-group">
                        <input id="k3" type="number" step="0.1" value="0.1" class="form-control" placeholder="0.1">
                        <button class="btn btn-primary updateBtn" data-index="3" data-input="k3">Update</button>
                    </div>
                </div>

                <div>
                    <label class="form-label fw-semibold text-muted mb-1">Target Angle</label>
                    <div class="input-group">
                        <input id="target" type="number" step="0.1" value="93.5" class="form-control" placeholder="93.5">
                        <button class="btn btn-primary updateBtn" data-index="4" data-input="target">Update</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
